<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta property="og:title" content="Theertham — Pure Vegetarian South Indian Restaurant" />
    <meta property="og:description" content="A scroll-driven culinary journey into South Indian tiffin & banana-leaf meals in Nashik, Maharashtra." />
    <meta property="og:type" content="website" />

        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Rozha+One&family=Yatra+One&display=swap"
      />

    <!-- Only what the first screen needs -->
    <link rel="preload" as="image" href="/assets/aistudio/reslogo_87cb0913.jpeg" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-landscape-first.webp" media="(min-aspect-ratio: 9/10)" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-portrait-first.webp" media="(max-aspect-ratio: 9/10)" fetchpriority="high" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234F5A2A'/%3E%3Cpath d='M16 6C13 11 11 15 11 19a5 5 0 0 0 10 0c0-4-2-8-5-13z' fill='%23FFF8E7'/%3E%3Ccircle cx='16' cy='19' r='2' fill='%23C8963E'/%3E%3C/svg%3E" />

    <!-- INSTANT LOADER: same look as before, but it is plain HTML/CSS so it shows on the very first paint -->
    <style>
      html, body { margin: 0; background: #7f8551; }
      #boot {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        overflow: hidden; user-select: none; -webkit-user-select: none;
        background: radial-gradient(circle at center, #a2a76d 0%, #8c9159 55%, #7f8551 100%);
        transition: opacity .5s ease;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .glow {
        position: absolute; width: 360px; height: 360px; border-radius: 9999px; pointer-events: none;
        background: radial-gradient(circle, rgba(255,236,170,.42) 0%, rgba(200,150,62,.18) 50%, transparent 72%);
        animation: boot-glow 2s ease-in-out infinite;
      }
      @media (min-width: 640px) { #boot .glow { width: 520px; height: 520px; } }
      #boot .wrap { position: relative; z-index: 1; width: min(86vw, 420px); padding: 0 16px; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; }
      #boot .card {
        position: relative; width: 100%; box-sizing: border-box; overflow: hidden; border-radius: 24px; padding: 24px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(to bottom, rgba(255,255,255,.25), rgba(255,255,255,.10), rgba(59,70,30,.30));
        border: 1px solid rgba(255,255,255,.65); border-top-color: rgba(255,255,255,.9); border-bottom-color: rgba(255,255,255,.3);
        box-shadow: 0 20px 50px rgba(20,35,18,.28), inset 0 2px 4px 0 rgba(255,255,255,.85), inset 0 -1.5px 3px 0 rgba(0,0,0,.15);
        animation: boot-card 2s ease-in-out infinite alternate;
      }
      @media (min-width: 640px) { #boot .card { padding: 32px; } }
      #boot .gloss { position: absolute; left: 0; right: 0; top: 0; height: 50%; background: linear-gradient(to bottom, rgba(255,255,255,.45), transparent); pointer-events: none; }
      #boot .beam { position: absolute; inset: 0; background: linear-gradient(125deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,.08) 35%, transparent 60%); pointer-events: none; }
      #boot .logo { position: relative; width: 100%; aspect-ratio: 1573 / 1000; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,.3); box-shadow: 0 25px 50px -12px rgba(0,0,0,.25); }
      #boot .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
      #boot .name { margin-top: 16px; text-align: center; font-family: 'Rozha One','Yatra One',Georgia,serif; font-weight: 700; font-size: 24px; letter-spacing: .2em; color: #fff8e7; text-shadow: 0 2px 6px rgba(0,0,0,.25); }
      #boot .sub { margin-top: 4px; text-align: center; font-family: 'Poppins',system-ui,sans-serif; font-weight: 500; font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: rgba(255,248,231,.9); }
      @media (min-width: 640px) { #boot .name { font-size: 30px; margin-top: 20px; } #boot .sub { font-size: 12px; } }
      #boot .bar { position: relative; margin-top: 24px; width: min(56vw, 260px); height: 4px; border-radius: 9999px; overflow: hidden; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3); box-sizing: content-box; }
      #boot .fill { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; border-radius: 9999px; background: linear-gradient(to right, #fff8e7, #fff, #fff8e7); box-shadow: 0 0 8px rgba(255,255,255,.8); transform-origin: left center; animation: boot-fill 1.3s cubic-bezier(.2,.7,.2,1) forwards; }
      #boot .fill i { position: absolute; inset: 0; background: linear-gradient(to right, transparent, #fff, transparent); animation: boot-shimmer 1.2s linear infinite; }
      #boot .status { margin-top: 14px; display: flex; align-items: center; gap: 6px; font-family: 'Poppins',system-ui,sans-serif; font-weight: 500; font-size: 13px; letter-spacing: .05em; color: #fff8e7; }
      #boot .dots { display: inline-flex; gap: 4px; margin-left: 2px; }
      #boot .dots b { width: 6px; height: 6px; border-radius: 9999px; background: #fff8e7; animation: boot-bounce .8s infinite; }
      #boot .dots b:nth-child(2) { animation-delay: .15s; }
      #boot .dots b:nth-child(3) { animation-delay: .3s; }
      @keyframes boot-glow { 0%,100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }
      @keyframes boot-card { from { transform: scale(1); } to { transform: scale(1.025); } }
      @keyframes boot-fill { from { transform: scaleX(.15); } to { transform: scaleX(1); } }
      @keyframes boot-shimmer { from { transform: translateX(-100%); } to { transform: translateX(200%); } }
      @keyframes boot-bounce { 0%,100% { transform: translateY(-25%); } 50% { transform: none; } }
      @media (prefers-reduced-motion: reduce) { #boot * , #boot { animation: none !important; } }
    </style>
  </head>
  <body class="bg-[#FFF8E7] text-[#1F3A1F] antialiased selection:bg-[#7A7F45] selection:text-white overflow-x-hidden">
    <div id="boot" role="status" aria-live="polite" aria-label="Loading Theertham">
      <div class="glow"></div>
      <div class="wrap">
        <div class="card">
          <div class="gloss"></div>
          <div class="beam"></div>
          <div class="logo">
            <img src="/assets/aistudio/reslogo_87cb0913.jpeg" width="1573" height="1000" alt="Theertham Pure Vegetarian South Indian Restaurant" fetchpriority="high" decoding="async" />
          </div>
          <div class="name">THEERTHAM</div>
          <div class="sub">Pure Vegetarian · Nashik</div>
        </div>
        <div class="bar"><div class="fill"><i></i></div></div>
        <div class="status"><span>Preparing your table</span><span class="dots"><b></b><b></b><b></b></span></div>
      </div>
    </div>
    <script>
      // The app calls window.hideBoot() when the first hero image and fonts are ready.
      // Safety: it always disappears after 2.5 seconds.
      window.hideBoot = function () {
        var b = document.getElementById('boot');
        if (!b || b.classList.contains('done')) return;
        b.classList.add('done');
        setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 600);
      };
      setTimeout(window.hideBoot, 2500);
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
